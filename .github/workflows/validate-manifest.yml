name: Validate manifest
on:
  push:
    paths:
      - tests/fixtures/manifest.json
      - src/llm_logparser/core/parser.py
      - src/llm_logparser/core/schemas/manifest.schema.json
      - .github/workflows/validate-manifest.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: 3.11 }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate, Draft202012Validator
          schema_path = Path("src/llm_logparser/core/schemas/manifest.schema.json")
          manifest_path = Path("tests/fixtures/manifest.json")
          sch = json.loads(schema_path.read_text(encoding="utf-8"))
          man = json.loads(manifest_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(sch)
          validate(instance=man, schema=sch)
          print(f"{manifest_path} is valid against {schema_path} ✅")
          PY
