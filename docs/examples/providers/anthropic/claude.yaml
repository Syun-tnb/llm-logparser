# Provider Config — Claude (Anthropic)
# 目的: Claude エクスポートの“生データ”を共通スキーマへ正規化するためのマッピング定義。
# この設定はコード改変なしで調整可能。必要に応じて書式・フィールド名を合わせてください。

id: claude
version: 1
export_formats: [json] # TODO: JSONL / NDJSON エクスポートの有無を確認

# 受け入れ判定（任意情報）：ファイル先頭のヒューリスティクスに使う
detection:
  probable_keys: ["uuid", "chat_messages", "created_at", "updated_at"]

# ===== フィールドマッピング =====
# 例: エクスポート1件のJSONが以下のような形を想定（実データに合わせて調整）
# このマッピングは conversation オブジェクト配下の `chat_messages[]` を
# 1件ずつ展開して評価する前提のサンプルです。
# {
#   "uuid": "16b9da4c-4b08-4bf4-85a8-911b04434241",
#   "name": "Exporting Claude conversation logs",
#   "created_at": "2025-11-03T06:35:18.207511Z",
#   "chat_messages": [
#     {
#       "uuid": "173e90df-bb2b-4da6-beb0-680876391ae4",
#       "created_at": "2025-11-03T06:35:19.537017Z",
#       "sender": "human",
#       "content": [{ "type": "text", "text": "Claudeは会話ログを出力する方法ある？" }],
#       "attachments": []
#     }
#   ]
# }

fields:
  conversation_id:
    path: "$.uuid"

  message_id:
    path: "$.chat_messages[*].uuid" # `chat_messages[]` 展開後は `$.uuid` 相当を想定

  timestamp:
    path: "$.chat_messages[*].created_at"
    type: "iso"               # iso | epoch | epoch_ms
    timezone_hint: "UTC"      # 解析時のヒント（未使用可）

  role:
    path: "$.chat_messages[*].sender"

  author_name:
    # 現行の Claude fixture では送信者表示名フィールドは見当たらない
    path: null
    default: null

  model:
    # TODO: confirm actual export structure
    # 現行 fixture / adapter ではモデル名をメッセージ単位で参照していない
    path: null

  content:
    # content は block 配列想定。text block だけを順序維持で結合する前提。
    path: "$.chat_messages[*].content[*].text"
    joiner: "\n"              # パーツの連結文字
    fallback_path: "$.chat_messages[*].text" # 簡易テキスト字段がある場合の代替

  attachments:
    # 現行 fixture では空配列。あっても任意扱いにする。
    path: "$.chat_messages[*].attachments"

# ===== 正規化ルール =====
role_map:
  human: user
  user: user
  assistant: assistant
  system: system
  tool: tool

missing_field_policy: "warn"   # skip | warn | fill_default

# ===== 既定値のフォールバック =====
fallbacks:
  author_name: null
  model: null

# ===== 文字エンコーディング・制御文字 =====
text:
  normalize_newlines: true      # \r\n → \n
  strip_control_chars: true     # 制御文字を可及的に除去/置換
  max_message_bytes: 10485760   # 10MB超はWARNして通す（切り捨てはしない）

# ===== タイムスタンプ補正 =====
timestamp_correction:
  monotonic_if_missing: true    # 欠落時は読み込み順で単調増加付与

# ===== バリデーション =====
validation:
  required_fields:
    - conversation_id
    - message_id
    - role
    - content
  warn_if_missing:
    - model
    - author_name

# ===== 出力メタ（Markdownヘッダに反映） =====
output_meta:
  provider_label_i18n_key: "provider.name.claude" # i18nで「Claude」を解決
  model_label_i18n_key: "output.header.models"
