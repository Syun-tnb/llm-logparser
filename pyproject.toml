[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-logparser"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4", "PyYAML>=6", "tiktoken>=0.12.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_logparser = ["i18n/*.yaml", "core/schemas/*.json"]

[project.scripts]
llm-logparser = "llm_logparser.cli.cli:main"  # 例：CLIがあるなら
llp = "llm_logparser.cli.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = [
  "unit: focused tests for isolated logic and helpers",
  "cli: tests for CLI parsing, wiring, and command behavior",
  "contract: tests for machine-readable artifact contracts and schemas",
  "integration: deterministic end-to-end or subsystem pipeline tests",
]
