[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-logparser"
version = "1.4.0"
description = "Privacy-first LLM chat log parser for deterministic local analysis and export"
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

authors = [
  { name = "Syun-tnb" }
]

dependencies = [
  "numpy>=1.26",
  "jsonschema>=4",
  "PyYAML>=6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_logparser = [
  "i18n/*.yaml",
  "core/schemas/*.json",
  "resources/cross_thread/*.yaml",
  "resources/lexical_rule_candidates/*.yaml",
  "resources/token_dictionary_lexical_rules/*.yaml",
  "resources/semantic_state/*.yaml",
  "resources/semantic_normalization_prompts/*.txt",
]

[project.scripts]
llm-logparser = "llm_logparser.cli.cli:main"
llp = "llm_logparser.cli.cli:main"

[project.optional-dependencies]
tokens = ["tiktoken>=0.12.0"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: focused tests for isolated logic and helpers",
  "cli: tests for CLI parsing, wiring, and command behavior",
  "contract: tests for machine-readable artifact contracts and schemas",
  "integration: deterministic end-to-end or subsystem pipeline tests",
]
