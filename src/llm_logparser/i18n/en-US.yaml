analysis:
  refusal:
    indicators:
      - "I can't help with that"
      - "I cannot provide"
      - "against policy"
  safety:
    intervention_indicators:
      - "it's important to note"
      - "however, you should be aware"
      - "i can provide safer alternatives"
      - "be careful when"
  correction:
    cues:
      - "no, that's not what I meant"
      - "that’s not what I meant"
      - "that's not what I meant"
      - "that's not correct"
      - "that is not correct"
  revision:
    cues:
      - "no, that's not what I meant"
      - "that’s not what I meant"
      - "that's not what I meant"
      - "in other words"
      - "what I mean is"
      - "let me rephrase"
      - "to clarify"
      - "I mean"
  clarification:
    cues:
      - "in other words"
      - "what I mean is"
      - "let me rephrase"
      - "to clarify"
      - "i mean"
