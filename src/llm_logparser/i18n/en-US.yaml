messages:
  cli.description: CLI interface for LLM Log Parser (MVP)
  cli.option.lang.help: UI language/locale for CLI output (use --locale, alias --lang; e.g. en, ja)
  cli.option.log_level.help: Log level override (DEBUG|INFO|WARNING|ERROR|CRITICAL); overrides environment variable
  cli.option.config.help: Path to config.yaml
  cli.option.profile.help: Profile name to use
  cli.option.non_interactive.help: Disable interactive prompts and fail when required values are missing
  cli.option.timezone.help: IANA timezone (e.g., Asia/Tokyo)
  cli.option.formatting.help: Apply minimal Markdown formatting (none|light).
  cli.option.split.help: size=<4M|512KiB|...> or count=<N> or auto (auto = size=4M & count=1500)
  cli.option.tiny_tail_threshold.help: Threshold for tail merge (message count)
  cli.parse.help: Parse provider export JSON into normalized JSONL threads
  cli.export.help: Export parsed logs to Markdown
  cli.extract.help: Extract one conversation as Gemini-compatible JSON
  cli.analyze.help: Analyze canonical parsed JSONL threads
  cli.chain.help: Parse raw export and export all threads to Markdown in one shot
  cli.viewer.help: (placeholder) Run lightweight HTML viewer
  cli.config.help: Inspect and validate runtime configuration
  cli.lexical.help: Inspect read-only lexical policy and dictionary support data
  cli.lexical.observed.help: Inspect observed token facts without applying policy
  cli.lexical.observed.list.help: List high-frequency observed corpus tokens
  cli.lexical.observed.inspect.help: Inspect one observed token and its corpus evidence
  cli.lexical.observed.opt.input.help: "Input: provider artifact root containing l3/token-dictionary/observed_tokens.json"
  cli.lexical.observed.opt.token.help: Observed token to inspect
  cli.lexical.candidates.help: Inspect inactive lexical-rule candidates
  cli.lexical.candidates.list.help: List inactive lexical-rule candidates
  cli.lexical.candidates.inspect.help: Inspect one inactive lexical-rule candidate
  cli.lexical.candidates.opt.input.help: "Input: provider artifact root containing l3/lexical-rules/candidates.jsonl"
  cli.lexical.candidates.opt.candidate_id.help: Lexical-rule candidate ID to inspect
  cli.lexical.opt.limit.help: Maximum rows to display
  cli.lexical.policy.help: Validate and resolve reviewed lexical policy without modifying files
  cli.lexical.policy.validate.help: Validate explicitly provided reviewed lexical rule YAML files
  cli.lexical.policy.resolve.help: Resolve active lexical policy layers and print compact diagnostics
  cli.lexical.policy.opt.locale.help: Locale tag for built-in cross-thread lexical resources
  cli.lexical.policy.opt.project_lexical_rules.help: Explicit reviewed project lexical rules YAML
  cli.lexical.policy.opt.user_lexical_rules.help: Explicit reviewed user lexical rules YAML
  cli.config.path.help: Show the resolved config file path
  cli.config.show.help: Print the normalized config or selected profile
  cli.config.validate.help: Validate the current config and exit
  cli.parse.opt.provider.help: Provider ID (e.g., openai)
  cli.parse.opt.input.help: "Input: raw export file or directory"
  cli.parse.opt.outdir.help: Output root directory (provider subdir will be auto-created)
  cli.parse.opt.dry_run.help: Run parse without writing any files (stats/log only).
  cli.parse.opt.fail_fast.help: Stop parsing on first error instead of continuing.
  cli.parse.opt.validate_schema.help: Validate normalized messages against message.schema.json
  cli.parse.opt.message_window_size.help: Number of canonical messages per generated message window
  cli.parse.opt.message_window_stride.help: Advance step between generated message windows. Defaults to the window size when omitted.
  cli.export.opt.input.help: "Input: single parsed.jsonl file"
  cli.extract.opt.input.help: "Input: raw export file or directory"
  cli.export.opt.out.help: Output Markdown path
  cli.extract.opt.conversation_id.help: Conversation ID to extract
  cli.extract.opt.outdir.help: Output root directory
  cli.analyze.opt.input.help: "Input: parsed.jsonl file or directory containing parsed.jsonl"
  cli.analyze.opt.json.help: Emit JSON instead of human-readable text
  cli.analyze.opt.out.help: Write the rendered result to a file
  cli.analyze.opt.skip_existing.help: Skip threads whose sidecar already exists. By default, existing sidecars are rebuilt and overwritten.
  cli.analyze.opt.dry_run.help: Preview sidecar generation without writing any files
  cli.analyze.stats.help: Compute deterministic conversation statistics from parsed JSONL
  cli.analyze.stats.opt.per_thread.help: Include per-thread rows in human-readable output
  cli.analyze.stats.opt.top.help: Limit the number of per-thread rows after sorting
  cli.analyze.stats.opt.sort.help: Sort field for per-thread rows
  cli.analyze.stats.opt.include_role_breakdown.help: Include breakdown of roles other than user and assistant
  cli.analyze.datasheet.help: Build a deterministic appendix-ready dataset summary from canonical parsed artifacts
  cli.analyze.timeline.help: Aggregate timestamped message activity over time
  cli.analyze.timeline.opt.bucket.help: Bucket size for timeline aggregation
  cli.analyze.tokens.help: Build deterministic token_stats.json sidecars from canonical parsed JSONL. Existing sidecars are rebuilt by default.
  cli.analyze.tokens.opt.model.help: Optional model name for tokenizer resolution (primarily for OpenAI)
  cli.analyze.tokens.opt.encoding.help: Explicit tiktoken encoding name that overrides provider/model resolution
  cli.analyze.metrics.help: Build deterministic metrics.json sidecars from parsed.jsonl plus token_stats.json. Run `analyze tokens` first. Existing sidecars are rebuilt by default.
  cli.analyze.token_dictionary.help: Build an additive L3 token-dictionary sidecar from canonical parsed.jsonl plus optional token_stats.json and topics.json inputs.
  cli.analyze.token_dictionary.opt.input.help: "Input: directory only; provider artifact root containing parsed.jsonl threads and optional l3/semantic-topics/topics.json"
  cli.analyze.token_dictionary.opt.overwrite.help: Rebuild observed_tokens.json, bundles.json, and provenance.json even when they already exist (default behavior already rebuilds).
  cli.analyze.sqlite_build.help: Build an optional SQLite accelerator from canonical thread artifacts
  cli.analyze.sqlite_build.opt.input.help: "Input: directory only; root containing per-provider artifact directories"
  cli.analyze.sqlite_build.opt.provider.help: "Provider ID to index (for example: openai)"
  cli.analyze.sqlite_build.opt.overwrite.help: Delete an existing analysis.db before rebuilding
  cli.analyze.recall.help: Search canonical message text through an existing L2 analysis.db FTS index
  cli.analyze.recall.opt.input.help: "Input: provider artifact root containing analysis.db"
  cli.analyze.recall.opt.query.help: FTS query string to search in canonical message text
  cli.analyze.recall.opt.limit.help: Maximum number of recall matches to display
  cli.analyze.recall.opt.context_before.help: Number of previous same-conversation messages to show around each anchor
  cli.analyze.recall.opt.context_after.help: Number of following same-conversation messages to show around each anchor
  cli.analyze.recall.opt.bookends.help: Number of first and last same-conversation messages to include as compact evidence
  cli.analyze.recall.opt.role.help: Optional canonical role filter
  cli.analyze.recall.opt.conversation_id.help: Optional conversation ID filter
  cli.analyze.semantic_prototype.help: Build experimental window_embeddings.jsonl, window_neighbors.jsonl, and window_clusters.jsonl artifacts from message_windows.jsonl or canonical parsed.jsonl
  cli.analyze.semantic_prototype.opt.input.help: "Input: message_windows.jsonl or parsed.jsonl file, or directory containing those artifacts"
  cli.analyze.semantic_prototype.opt.backend.help: "Embedding backend to use (`deterministic-hash` or `ollama`)"
  cli.analyze.semantic_prototype.opt.model.help: "Embedding model identifier. Required for `--backend ollama`."
  cli.analyze.semantic_prototype.opt.top_k.help: Number of nearest neighbors to keep per window
  cli.analyze.semantic_prototype.opt.min_score.help: Minimum cosine similarity score required before a neighbor is emitted
  cli.analyze.semantic_prototype.opt.max_input_bytes.help: Safe UTF-8 byte budget for one embedding request before deterministic chunking is applied
  cli.analyze.semantic_prototype.opt.chunk_overlap_bytes.help: UTF-8 byte overlap budget to retain between deterministic embedding chunks
  cli.analyze.semantic_prototype.opt.aggregate.help: Aggregation method for chunk embeddings
  cli.analyze.semantic_prototype.opt.sqlite_db.help: Optional path to analysis.db for SQLite-assisted candidate generation
  cli.analyze.semantic_prototype.opt.candidate_window_days.help: Candidate retrieval window in days around each target window timestamp when SQLite mode is active
  cli.analyze.semantic_prototype.opt.candidate_min_chars.help: Minimum candidate window character count when SQLite mode is active
  cli.analyze.semantic_prototype.opt.candidate_min_assistant_ratio.help: Minimum assistant_messages / message_count ratio for candidate source threads in SQLite mode
  cli.analyze.semantic_prototype.opt.candidate_same_thread.help: Same-thread candidate policy in SQLite mode (allow, prefer, only, exclude)
  cli.analyze.semantic_prototype.opt.overwrite.help: Overwrite existing window_embeddings.jsonl, window_neighbors.jsonl, and window_clusters.jsonl artifacts
  cli.analyze.intra_thread_topics.help: Build experimental contiguous intra-thread segments from canonical parsed.jsonl
  cli.analyze.intra_thread_topics.opt.input.help: "Input: parsed.jsonl file or directory containing parsed.jsonl files"
  cli.analyze.intra_thread_topics.opt.backend.help: "Embedding backend to use (`deterministic-hash` or `ollama`)"
  cli.analyze.intra_thread_topics.opt.model.help: "Embedding model identifier. Required for `--backend ollama`."
  cli.analyze.intra_thread_topics.opt.window_size.help: Sliding window size in messages
  cli.analyze.intra_thread_topics.opt.window_stride.help: Sliding window stride in messages
  cli.analyze.intra_thread_topics.opt.boundary_threshold.help: Fixed adjacent-window continuity threshold below which a boundary is emitted
  cli.analyze.intra_thread_topics.opt.max_input_bytes.help: Safe UTF-8 byte budget for one embedding request before deterministic chunking is applied
  cli.analyze.intra_thread_topics.opt.chunk_overlap_bytes.help: UTF-8 byte overlap budget to retain between deterministic embedding chunks
  cli.analyze.intra_thread_topics.opt.aggregate.help: Aggregation method for chunk embeddings
  cli.analyze.intra_thread_topics.opt.overwrite.help: Overwrite existing l3/intra-thread-topics boundary and segment artifacts
  cli.analyze.intra_thread_topics.opt.report.help: Write l3/intra-thread-topics/report.md from existing intra-thread artifacts without recomputing embeddings
  cli.analyze.intra_thread_topics.opt.merge_segments.help: Write l3/intra-thread-topics/segment-merge.jsonl with non-contiguous intra-thread segment groups
  cli.analyze.intra_thread_topic_summaries.help: Build deterministic heuristic topic-summaries.jsonl from existing intra-thread segments
  cli.analyze.intra_thread_topic_summaries.opt.input.help: "Input: parsed.jsonl file or directory containing parsed.jsonl files with l3/intra-thread-topics/segments.jsonl"
  cli.analyze.intra_thread_topic_summaries.opt.source.help: Summary source to write (heuristic or local-llm)
  cli.analyze.intra_thread_topic_summaries.opt.model.help: Local Ollama generation model for --source local-llm. Defaults to gemma4-Q8_K_XL:latest.
  cli.analyze.intra_thread_topic_summaries.opt.base_url.help: Base URL for the local Ollama server
  cli.analyze.intra_thread_topic_summaries.opt.timeout_seconds.help: Per-segment Ollama request timeout in seconds
  cli.analyze.intra_thread_topic_summaries.opt.jobs.help: Number of thread-level workers. Use conservative values such as 1 or 2 for local Ollama.
  cli.analyze.intra_thread_topic_summaries.opt.overwrite.help: Overwrite existing l3/intra-thread-topics/topic-summaries.jsonl artifacts
  cli.analyze.semantic_preview.help: Browse semantic clusters, conversations, or individual windows from stored L3 prototype artifacts
  cli.analyze.semantic_preview.opt.input.help: "Input: directory only; provider artifact root containing message_windows.jsonl, window_clusters.jsonl, and optional window_neighbors.jsonl files"
  cli.analyze.semantic_preview.opt.cluster_id.help: Show one cluster in detail
  cli.analyze.semantic_preview.opt.conversation_id.help: Conversation/thread ID to inspect (also accepted as --thread)
  cli.analyze.semantic_preview.opt.window.help: Window ID to inspect. Use with --conversation-id/--thread for window view.
  cli.analyze.semantic_preview.opt.top_clusters.help: Number of clusters to show in the default cluster-list view
  cli.analyze.semantic_preview.opt.min_cluster_size.help: Minimum cluster size to include in list or conversation views
  cli.analyze.semantic_preview.opt.cross_thread_only.help: Restrict list or conversation views to clusters spanning more than one conversation
  cli.analyze.semantic_preview.opt.json.help: Emit machine-readable JSON instead of pretty text
  cli.analyze.semantic_preview.opt.top_k.help: Limit neighbor relationships shown in detail views. For window view, limit the number of stored neighbors shown.
  cli.analyze.semantic_preview.opt.include_text.help: Include reconstructed window text in the preview (use --no-include-text to disable)
  cli.analyze.semantic_preview.opt.max_chars.help: Maximum number of characters to show per window before truncation
  cli.analyze.semantic_preview.opt.show_meta.help: Include metadata blocks in the preview (use --no-show-meta to disable)
  cli.analyze.semantic_span_proposals.help: Build an experimental semantic-span proposal sidecar from canonical messages and current window-backed L3 inputs
  cli.analyze.semantic_span_proposals.opt.input.help: "Input: directory only; provider artifact root containing parsed.jsonl threads, message_windows.jsonl sidecars, and optional window_clusters.jsonl files"
  cli.analyze.semantic_topic.help: Generate experimental L4 topic labels and summaries from stored L3 clusters using a local Ollama model
  cli.analyze.semantic_topic.opt.input.help: "Input: directory only; provider artifact root containing message_windows.jsonl and window_clusters.jsonl files"
  cli.analyze.semantic_topic.opt.model.help: Local Ollama generation model identifier
  cli.analyze.semantic_topic.opt.cluster_id.help: Generate one topic for the specified cluster only
  cli.analyze.semantic_topic.opt.top_clusters.help: Number of clusters to label when --cluster-id is not provided
  cli.analyze.semantic_topic.opt.min_cluster_size.help: Minimum cluster size to include before prompting the local model
  cli.analyze.semantic_topic.opt.cross_thread_only.help: Restrict topic generation to clusters spanning more than one conversation
  cli.analyze.semantic_topic.opt.base_url.help: Base URL for the local Ollama server
  cli.analyze.semantic_topic.opt.timeout_seconds.help: Per-cluster Ollama request timeout in seconds
  cli.analyze.semantic_topic.opt.state_locale.help: Locale tag for L3 span-state phrase matching. Keeps UI locale separate and falls back to en-US.
  cli.analyze.semantic_topic.opt.json.help: Emit machine-readable JSON instead of pretty text
  cli.analyze.semantic_topics.help: Build formal semantic topic artifacts with forward and reverse lookup from stored L3 clusters
  cli.analyze.semantic_topics.opt.input.help: "Input: directory only; provider artifact root containing message_windows.jsonl and window_clusters.jsonl files. Must be provided explicitly at runtime; not read from config for safety."
  cli.analyze.semantic_topics.opt.model.help: Optional local Ollama generation model. Omit for structural-only topic artifacts.
  cli.analyze.semantic_topics.opt.cluster_id.help: Build artifacts for one cluster only. When used, it must be provided explicitly at runtime; not read from config for safety.
  cli.analyze.semantic_topics.opt.min_cluster_size.help: Minimum cluster size to include in the generated topic set
  cli.analyze.semantic_topics.opt.cross_thread_only.help: Restrict the generated topic set to clusters spanning more than one conversation
  cli.analyze.semantic_topics.opt.base_url.help: Base URL for the local Ollama server
  cli.analyze.semantic_topics.opt.timeout_seconds.help: Per-cluster Ollama request timeout in seconds when --model is used
  cli.analyze.semantic_topics.opt.state_locale.help: Locale tag for L3 span-state phrase matching. Keeps UI locale separate and falls back to en-US.
  cli.analyze.semantic_topics.opt.normalization_job.help: Attach precomputed representative-span normalization from one semantic-normalization batch job. Must be provided explicitly at runtime; not read from config for safety.
  cli.analyze.semantic_topics.opt.normalize_representative_spans.help: Enable inline representative-span normalization during this semantic-topics run. Distinct from --normalization-job.
  cli.analyze.semantic_topics.opt.refine_representative_spans_from_proposals.help: Refine representative spans from the experimental semantic-span-proposals sidecar. Opt-in only; does not change cluster membership or topic IDs.
  cli.analyze.semantic_topics.opt.expected_taxonomy_version.help: Expected semantic-normalization taxonomy version for batch-consumed normalization
  cli.analyze.semantic_topics.opt.strict_normalization.help: Treat semantic-normalization taxonomy or prompt provenance mismatches as errors instead of warnings
  cli.analyze.cross_thread_candidates.help: Extract experimental cross-thread continuity candidates from semantic-topics representative spans
  cli.analyze.cross_thread_candidates.opt.input.help: "Input: directory only; provider artifact root containing l3/semantic-topics/topics.json"
  cli.analyze.cross_thread_candidates.opt.min_score.help: Minimum deterministic evidence score required to emit one cross-thread candidate link
  cli.analyze.cross_thread_candidates.opt.top_per_source.help: Maximum candidate links to emit per source representative span
  cli.analyze.cross_thread_candidates.opt.unit_source.help: Unit source for matching; semantic-topics keeps current behavior, topic-summaries uses provisional L3 intra-thread summaries, auto prefers usable summaries when present
  cli.analyze.cross_thread_candidates.opt.embedding_model.help: Optional local Ollama embedding model used only to enrich already-emitted candidate rows with embedding similarity
  cli.analyze.cross_thread_candidates.opt.embedding_base_url.help: Base URL for the optional local Ollama embedding endpoint
  cli.analyze.cross_thread_candidates.opt.embedding_timeout_seconds.help: Timeout in seconds for optional local Ollama embedding requests
  cli.analyze.cross_thread_candidates.opt.project_lexical_rules.help: Explicit reviewed project lexical rules YAML to merge above built-in cross-thread resources
  cli.analyze.cross_thread_candidates.opt.user_lexical_rules.help: Explicit reviewed user lexical rules YAML to merge above built-in and project cross-thread resources
  cli.analyze.lexical_rule_candidates.help: Generate inactive reviewed lexical-rule candidates from token dictionary statistics
  cli.analyze.lexical_rule_candidates.opt.input.help: "Input: directory only; provider artifact root containing l3/token-dictionary/observed_tokens.json (dictionary.json is a legacy alias)"
  cli.analyze.lexical_rule_candidates.opt.project_lexical_rules.help: Explicit reviewed project lexical rules YAML to treat as already-active policy
  cli.analyze.lexical_rule_candidates.opt.user_lexical_rules.help: Explicit reviewed user lexical rules YAML to treat as already-active policy
  cli.analyze.lexical_rule_candidates.opt.max_candidates_per_type.help: Maximum inactive lexical-rule candidates to emit per candidate type
  cli.analyze.lexical_rule_candidates.opt.sample_limit.help: Maximum sample references to attach to each inactive candidate
  cli.analyze.lexical_rule_candidates.opt.overwrite.help: Replace existing l3/lexical-rules candidate artifacts
  cli.analyze.review_candidates.help: Build an inactive L3 review queue from existing candidate artifacts
  cli.analyze.review_candidates.opt.input.help: "Input: provider artifact root containing optional lexical or cross-thread candidate artifacts"
  cli.analyze.review_candidates.opt.overwrite.help: Replace existing l3/review-queue artifacts
  cli.analyze.policy_effectiveness.help: Summarize inactive L3 policy-effectiveness diagnostics from existing candidate artifacts
  cli.analyze.policy_effectiveness.opt.input.help: "Input: provider artifact root containing optional lexical or cross-thread candidate artifacts"
  cli.analyze.policy_effectiveness.opt.overwrite.help: Replace existing l3/diagnostics policy effectiveness artifacts
  cli.analyze.cross_thread_intent_eval.help: Evaluate whether existing cross-thread candidate pairs express the same underlying intent or task continuation and write an additive L4 sidecar
  cli.analyze.cross_thread_intent_eval.opt.input.help: "Input: directory only; provider artifact root containing l3/cross-thread-candidates/candidates.jsonl"
  cli.analyze.cross_thread_intent_eval.opt.model.help: Local Ollama model used to judge same-intent continuity for each emitted candidate pair
  cli.analyze.cross_thread_intent_eval.opt.base_url.help: Base URL for the local Ollama generation endpoint
  cli.analyze.cross_thread_intent_eval.opt.timeout_seconds.help: Per-source Ollama request timeout in seconds for the L4 same-intent evaluation pass
  cli.analyze.cross_thread_memory_recall.help: Render a short human-readable memory recall view from stored L4 cross-thread intent evaluations
  cli.analyze.cross_thread_memory_recall.opt.input.help: "Input: directory only; provider artifact root containing l4/cross-thread-intent-eval/evaluations.jsonl"
  memory_recall.header: You have talked about something similar before
  memory_recall.source_section: "### Source:"
  memory_recall.matches_section: "### Matches:"
  memory_recall.approximate_date: "Approximate date: {date}"
  memory_recall.date_unknown: Unknown date
  memory_recall.no_matches: No similar past conversation was found.
  memory_recall.summary_line.release: This appears to follow the same release-completion flow as before.
  memory_recall.summary_line.status: This appears connected to a previous progress-sharing exchange.
  memory_recall.summary_line.template: This appears to be about a similar update discussed before.
  memory_recall.summary_line.generic: This appears to be a similar past exchange.
  memory_recall.match_line.release: A similar release-completion exchange exists in the past.
  memory_recall.match_line.status: A similar progress-sharing exchange exists in the past.
  memory_recall.match_line.template: A similar update exchange exists in the past.
  memory_recall.match_line.generic: A similar interaction exists in the past.
  memory_recall.reason_line: "  Reason: {reason}"
  cli.analyze.semantic_topic_explore.help: Explore semantic topics, reverse lookup message/topic membership, and browse topic timelines
  cli.analyze.semantic_topic_explore.opt.input.help: "Input: directory only; artifact root containing topics.json, topic_membership.jsonl, and message_windows.jsonl"
  cli.analyze.semantic_topic_explore.opt.topic_id.help: Show one topic in detail with its timeline
  cli.analyze.semantic_topic_explore.opt.message_id.help: Reverse lookup the topic or topics containing one message ID
  cli.analyze.semantic_topic_explore.opt.conversation_id.help: Show topics that appear in one conversation/thread (also accepted as --thread)
  cli.analyze.semantic_topic_explore.opt.hide_single_window.help: Hide topics marked as single-window by quality_signals during browse views
  cli.analyze.semantic_topic_explore.opt.min_window_count.help: Hide topics whose window_count is below this threshold during browse views
  cli.analyze.semantic_topic_explore.opt.min_conversation_count.help: Hide topics whose conversation coverage is below this threshold during browse views
  cli.analyze.semantic_topic_explore.opt.min_displayable_messages.help: In pretty-text browse output, hide topics whose canonical displayable message count is below this threshold
  cli.analyze.semantic_topic_explore.opt.view.help: Render one topic as a human-readable span/message view reconstructed from parsed.jsonl
  cli.analyze.semantic_topic_explore.opt.full_messages.help: With --view, show the full topic message sequence ordered by time instead of representative spans
  cli.analyze.semantic_topic_explore.opt.max_chars.help: Maximum characters to show per reconstructed message in --view output
  cli.analyze.semantic_topic_explore.opt.json.help: Emit machine-readable JSON instead of pretty text
  cli.analyze.semantic_normalization.help: Run resumable semantic-normalization sidecar jobs from provider-root thread artifacts
  cli.analyze.semantic_normalization.run.help: Create and run one semantic-normalization batch job
  cli.analyze.semantic_normalization.status.help: Show current progress for one semantic-normalization job
  cli.analyze.semantic_normalization.resume.help: Resume pending spans for one semantic-normalization job
  cli.analyze.semantic_normalization.retry_failures.help: Retry failed spans for one semantic-normalization job
  cli.analyze.semantic_normalization.summary.help: Show the current summary for one semantic-normalization job
  cli.analyze.semantic_normalization.compare.help: Compare two semantic-normalization jobs under the same provider root
  cli.analyze.semantic_normalization.opt.input.help: "Input: directory only; provider artifact root containing parsed.jsonl threads and optional message_windows.jsonl sidecars"
  cli.analyze.semantic_normalization.opt.job_id.help: Existing or requested semantic-normalization job ID
  cli.analyze.semantic_normalization.opt.job_a.help: First semantic-normalization job ID to compare
  cli.analyze.semantic_normalization.opt.job_b.help: Second semantic-normalization job ID to compare
  cli.analyze.semantic_normalization.opt.model.help: Local generation model identifier used for semantic normalization
  cli.analyze.semantic_normalization.opt.base_url.help: Base URL for the local Ollama server
  cli.analyze.semantic_normalization.opt.timeout_seconds.help: Per-request Ollama timeout in seconds
  cli.analyze.semantic_normalization.opt.temperature.help: Generation temperature for both raw-label and mapping steps
  cli.analyze.semantic_normalization.opt.raw_num_predict.help: Max output tokens for the raw-label step
  cli.analyze.semantic_normalization.opt.mapping_num_predict.help: Max output tokens for the mapping step
  cli.analyze.semantic_normalization.opt.overwrite.help: Overwrite an existing job directory if the requested job ID already exists
  cli.analyze.semantic_normalization.opt.span_id.help: Limit retry-failures to one span_id. Repeatable.
  cli.analyze.semantic_normalization.opt.limit.help: Maximum number of failed spans to retry in one invocation
  cli.analyze.semantic_normalization.opt.json.help: Emit machine-readable JSON instead of pretty text
  cli.chain.opt.input.help: "Input: raw export file or directory"
  cli.chain.opt.outdir.help: Root directory for artifacts (parse+export). Parsed JSONL will be under outdir/<provider>/...
  cli.chain.opt.export_outdir.help: Optional root directory to place all exported Markdown files. If omitted, Markdown is written next to each thread directory.
  cli.chain.opt.parsed_root.help: Optional root directory that already contains parsed threads (…/thread-*/parsed.jsonl). If specified, parse phase is skipped.
  cli.chain.opt.fail_fast.help: Stop chain processing on first export error. Default is to continue.
  cli.chain.opt.validate_schema.help: Validate normalized messages during the parse phase
  cli.chain.opt.message_window_size.help: Number of canonical messages per generated message window during the parse phase
  cli.chain.opt.message_window_stride.help: Advance step between generated message windows during the parse phase. Defaults to the window size when omitted.
  cli.parse.provider: "Provider: {provider}"
  cli.parse.input: "Input file: {path}"
  cli.parse.outdir: "Output directory: {path}"
  cli.parse.done: "Parsed {threads} threads ({messages} messages)"
