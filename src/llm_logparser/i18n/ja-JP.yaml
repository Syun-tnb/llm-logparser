  runtime.analyze.dry_run.existing_sidecars: "既存サイドカー数: {count}"
  runtime.analyze.dry_run.new_sidecars: "新規作成予定のサイドカー数: {count}"
  runtime.analyze.dry_run.rebuild_sidecars: "再生成予定の既存サイドカー数: {count}"
  runtime.analyze.dry_run.skipped_sidecars: "スキップした既存サイドカー数: {count}"
  runtime.analyze.dry_run.no_writes: "ファイルは書き込まれていません。"
  runtime.analyze.semantic_prototype.loading_windows: "semantic prototype: ウィンドウを読み込んでいます"
  runtime.analyze.semantic_prototype.loaded_windows: "semantic prototype: {windows} 件のウィンドウを読み込みました"
  runtime.analyze.semantic_prototype.generating_embeddings: "semantic prototype: 埋め込みを生成しています"
  runtime.analyze.semantic_prototype.embeddings_complete: "semantic prototype: 埋め込み生成完了 ({windows} ウィンドウ)"
  runtime.analyze.semantic_prototype.building_neighbors: "semantic prototype: 近傍を構築しています"
  runtime.analyze.semantic_prototype.building_clusters: "semantic prototype: クラスタを構築しています"
  runtime.analyze.semantic_prototype.neighbor_progress: "semantic prototype: 近傍 {count} / {total}"
  runtime.analyze.semantic_prototype.writing_artifacts: "semantic prototype: 成果物を書き込んでいます"
  runtime.analyze.semantic_prototype_written: "semantic prototype 成果物を書き込みました: {threads} スレッド / {windows} ウィンドウ (model={model})"
  runtime.config.deprecated_semantic_embedding_key: "非推奨の設定キー {context}.{legacy_key} は引き続き受け付けますが、今後は {context}.{replacement} を使用してください。"
  runtime.google_gemini.title_prefix_unrecognized: "現在のロケールでは Gemini のユーザー title 接頭辞を認識できなかったため、メッセージは未正規化のまま保持しました。意味解析の品質に影響する可能性があります。"
  error.path_not_found: "指定されたパスが存在しません: {path}"
  error.path_expected_file: "ファイルパスを指定してください: {path}"
  error.path_expected_dir: "ディレクトリパスを指定してください: {path}"
  error.missing_required: "'{command}' に必要なオプションが不足しています:"
  error.missing_required_hint.provider: "--provider / config: provider"
  error.missing_required_hint.input: "--input / config: input.path, input.paths, input.parsed(export)"
  error.missing_required_hint.conversation_id: "--conversation-id / config: extract.conversation_id"
  error.missing_required_hint.generic: CLI オプションまたは設定値
parsing:
  google_gemini:
    user_title_prefixes:
      - "送信したメッセージ: "
analysis:
  refusal:
    indicators:
      - "お手伝いできません"
      - "対応できません"
      - "お答えできません"
      - "ポリシー"
      - "ガイドライン"
  safety:
    intervention_indicators:
      - "重要なのは"
      - "注意してください"
      - "安全な代替案"
      - "気をつけてください"
  correction:
    cues:
      - "違う"
      - "そうじゃなくて"
      - "違います"
      - "その意味じゃない"
  revision:
    cues:
      - "違う"
      - "そうじゃなくて"
      - "いや"
      - "つまり"
      - "要するに"
      - "言い換えると"
      - "というか"
      - "言いたいのは"
  clarification:
    cues:
      - "つまり"
      - "要するに"
      - "言い換えると"
      - "言いたいのは"
      - "補足すると"
