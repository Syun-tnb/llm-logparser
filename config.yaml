# LLM Log Parser runtime config
#
# Discovery order:
# 1. --config <path>
# 2. LLM_LOGPARSER_CONFIG=<path>
# 3. ./config.yaml
# 4. nearest parent ./config.yaml
# 5. ~/.config/llm-logparser/config.yaml
#
# This file is YAML-only. External provider mapping YAML files are still
# documentation/examples and are not loaded by the parser at runtime.

schema_version: 1
active_profile: default

profiles:
  default:
    locale: ja-JP
    timezone: Asia/Tokyo
    provider: openai

    # parse / chain / extract read input.path or input.paths
    # export reads input.parsed
    input:
      path: artifacts/messages-latest.json
      parsed: artifacts/output/openai/thread-example/parsed.jsonl

    logging:
      level: info

    sanitize:
      enabled: true
      replacement: REDACTED
      scope: content_parts
      extra_keywords:
        - credential

    parse:
      outdir: artifacts
      validate_schema: true

    output:
      # Export output file path. This is a file, not a directory.
      path: artifacts/thread.md
      formatting: light
      split: auto
      split_soft_overflow: 0.2
      tiny_tail_threshold: 20

    chain:
      outdir: artifacts
      export_outdir: artifacts/markdown
      fail_fast: false
      validate_schema: true

    extract:
      outdir: artifacts
      conversation_id: example-conversation-id

  work:
    locale: en-US
    timezone: UTC
    provider: openai
    input:
      path: exports/workspace.json
      parsed: exports/workspace-parsed.jsonl
    sanitize:
      enabled: true
      replacement: "***"
      scope: all_strings
      mask_patterns:
        - acct-\d+
    parse:
      outdir: build/artifacts
    output:
      formatting: light
      split: size=4M
    chain:
      outdir: build/artifacts
    extract:
      outdir: build/artifacts
